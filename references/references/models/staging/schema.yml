version: 2

models:
  - name: stg_orders
    description: Cleaned order records with dates parsed from the source CSV.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
  - name: stg_order_details
    description: Cleaned order line items from the raw order details table.
    columns:
      - name: order_line_id
        data_tests:
          - unique
          - not_null
