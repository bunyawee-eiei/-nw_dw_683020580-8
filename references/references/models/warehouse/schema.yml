version: 2

models:
  - name: fct_order_lines
    description: One row per order line, with sales amounts and dimension keys.
    columns:
      - name: order_line_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: employee_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_employees')
                field: employee_id
      - name: shipper_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_shippers')
                field: shipper_id
      - name: order_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_order_dates')
                field: date_key
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
